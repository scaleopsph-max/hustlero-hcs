name: Deploy development

# Runs only when a maintainer pushes to deploy/development. Both jobs use the
# protected `development` environment, so each one waits for the owner's
# approval in GitHub before it can read the secrets:
#   1. plan  - lists pending migrations (dry run) and checks the API bundle; changes nothing.
#   2. apply - applies the pending migrations, deploys the API Worker, and smoke-tests it.
on:
  push:
    branches: [deploy/development]

permissions:
  contents: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: nlrzdgcxydmcvhushzwv
  API_URL: https://hustlero-hcs-api-development.scaleopsph.workers.dev

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Link development database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migration history (local vs development)
        run: npx supabase migration list --linked
      - name: Pending migrations (dry run, changes nothing)
        run: npx supabase db push --linked --skip-vault --dry-run
      - name: API bundle check (no upload)
        working-directory: apps/api
        run: npx wrangler deploy --env development --dry-run --outdir dist

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Link development database
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply pending migrations
        run: npx supabase db push --linked --skip-vault --yes
      - name: Migration history after apply
        run: npx supabase migration list --linked
      - name: Deploy API Worker (development)
        working-directory: apps/api
        run: npx wrangler deploy --env development
      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$API_URL/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "Health check failed at $API_URL/health" >&2
          exit 1
