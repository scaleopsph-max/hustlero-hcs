<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POS checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:#F5F5F6;background:#08080A;font-variant-numeric:tabular-nums}
button,input{font-family:inherit}
a{color:#E2C15F}a:hover{color:#F5E9BE}
.g{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.10);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
.gs{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);box-shadow:0 16px 48px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.16);-webkit-backdrop-filter:blur(32px) saturate(150%);backdrop-filter:blur(32px) saturate(150%)}
.gg{background:rgba(212,175,55,0.14);border:1px solid rgba(212,175,55,0.45);box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
</style>
</helmet>
<div style="position:relative;overflow:hidden;isolation:isolate;width:1280px;height:800px;padding:12px;display:flex;flex-direction:column;gap:12px;background:#08080A;">
  <div style="position:absolute;z-index:-1;left:500px;top:120px;width:560px;height:560px;border-radius:50%;background:#D4AF37;opacity:0.26;filter:blur(140px);pointer-events:none;"></div>
  <div style="position:absolute;z-index:-1;left:-160px;top:400px;width:480px;height:480px;border-radius:50%;background:#6B6B75;opacity:0.34;filter:blur(140px);pointer-events:none;"></div>
  <div style="position:absolute;z-index:-1;right:-120px;top:-100px;width:440px;height:440px;border-radius:50%;background:#6B6B75;opacity:0.30;filter:blur(140px);pointer-events:none;"></div>

  <div class="g" style="height:64px;flex:none;border-radius:20px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:20px;">
      <a href="POS-Sell.dc.html" style="display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid rgba(255,255,255,0.20);border-radius:12px;color:#fff;font-size:14px;font-weight:600;text-decoration:none;"><svg viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg>Back to sale</a>
      <span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:22px;font-weight:700;color:#fff;">Payment</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <span style="font-size:13px;color:#B4B4BA;">Main Branch, Register 1, Ana R.</span>
      <span style="display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);font-size:13px;font-weight:600;color:#fff;"><span style="width:9px;height:9px;border-radius:999px;background:#4AC480;"></span>Online, synced</span>
    </div>
  </div>

  <div style="flex:1 1 0;min-height:0;display:flex;gap:12px;">

    <div class="gs" style="width:380px;flex:none;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;">
      <h1 style="margin:0;font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:22px;line-height:28px;font-weight:700;color:#fff;">Order summary</h1>
      <div style="display:flex;flex-direction:column;">
        <sc-for list="{{lines}}" as="l" hint-placeholder-count="2">
          <div style="display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid rgba(255,255,255,0.12);">
            <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:15px;font-weight:600;color:#fff;">{{l.name}}</span><span style="font-size:13px;color:#B4B4BA;">{{l.detail}}</span></div>
            <span style="font-size:15px;font-weight:700;color:#fff;">{{l.total}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.12);font-size:14px;color:#D6D6DA;">
        <div style="display:flex;justify-content:space-between;"><span>Pricing</span><span>Wholesale, applied automatically</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Customer</span><span>Walk-in</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Discounts</span><span>₱0.00</span></div>
      </div>
      <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:18px;font-weight:700;color:#fff;">Total due</span><span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:36px;line-height:40px;font-weight:700;color:#fff;">₱1,986.00</span></div>
    </div>

    <div style="flex:1 1 0;min-width:0;padding:4px 4px;display:flex;flex-direction:column;gap:20px;">
      <div style="display:flex;gap:12px;">
        <sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
          <button style="flex:1 1 0;min-width:0;height:88px;border-radius:22px;border:1px solid {{m.border}};background:{{m.bg}};-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%);color:{{m.fg}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600;">
            <svg viewBox="0 0 24 24" style="width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="{{m.icon}}"></path></svg>{{m.label}}
          </button>
        </sc-for>
      </div>

      <div style="display:flex;gap:24px;align-items:flex-start;">
        <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:14px;">
          <div style="display:flex;flex-direction:column;gap:2px;"><span style="font-size:14px;color:#B4B4BA;">Amount due</span><span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:44px;line-height:48px;letter-spacing:-0.01em;font-weight:700;color:#fff;">₱1,986.00</span></div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label for="pos-cash" style="font-size:14px;font-weight:600;color:#F5F5F6;">Cash received</label>
            <input id="pos-cash" type="text" value="₱2,000.00" style="height:64px;border:2px solid #D4AF37;border-radius:18px;padding:0 18px;background:rgba(255,255,255,0.08);font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:34px;font-weight:700;color:#fff;">
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
              <button style="height:48px;padding:0 16px;border-radius:14px;border:1px solid {{q.border}};background:{{q.bg}};color:{{q.fg}};font-size:15px;font-weight:600;">{{q.label}}</button>
            </sc-for>
          </div>
          <div class="g" style="border-radius:18px;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;"><span style="font-size:16px;font-weight:600;color:#E9E9EB;">Change due</span><span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:34px;line-height:38px;font-weight:700;color:#E2C15F;">₱14.00</span></div>
        </div>

        <div style="width:330px;flex:none;display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:10px;">
          <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
            <button aria-label="{{k.aria}}" style="height:64px;border:1px solid rgba(255,255,255,0.20);border-radius:18px;background:rgba(255,255,255,0.08);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:26px;font-weight:600;">
              <sc-if value="{{k.isIcon}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z M14 9.5l4 4 M18 9.5l-4 4"></path></svg></sc-if>
              <sc-if value="{{k.isText}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="margin-top:auto;display:flex;flex-direction:column;gap:14px;">
        <div style="display:flex;gap:32px;align-items:center;">
          <label for="pos-print" style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;color:#fff;"><input id="pos-print" type="checkbox" defaultChecked="{{true}}" style="width:22px;height:22px;accent-color:#D4AF37;">Print receipt</label>
          <label for="pos-email" style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600;color:#B4B4BA;"><input id="pos-email" type="checkbox" disabled="{{true}}" style="width:22px;height:22px;">Email receipt</label>
          <span style="font-size:13px;color:#B4B4BA;">Add a customer to email a receipt.</span>
        </div>
        <a href="POS-Sell.dc.html" style="display:flex;align-items:center;justify-content:center;height:64px;border-radius:18px;background:#D4AF37;color:#0A0A0B;font-size:20px;font-weight:700;text-decoration:none;">Complete sale</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const digit = (n) => ({ label: n, aria: n, isText: true, isIcon: false });
    const method = (label, icon, on) => ({ label: label, icon: icon, bg: on ? 'rgba(212,175,55,0.18)' : 'rgba(255,255,255,0.07)', fg: on ? '#F5E9BE' : '#FFFFFF', border: on ? 'rgba(212,175,55,0.60)' : 'rgba(255,255,255,0.14)' });
    const chip = (label, on) => ({ label: label, bg: on ? 'rgba(212,175,55,0.18)' : 'rgba(255,255,255,0.08)', fg: on ? '#F5E9BE' : '#FFFFFF', border: on ? 'rgba(212,175,55,0.60)' : 'rgba(255,255,255,0.20)' });
    return {
      lines: [
        { name: 'Cold brew 500 ml, Original', detail: '12 × ₱118.00, wholesale', total: '₱1,416.00' },
        { name: 'Ube pandesal, pack of 6', detail: '6 × ₱95.00', total: '₱570.00' }
      ],
      methods: [
        method('Cash', 'M3 7h18v10H3z M12 14.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z', true),
        method('E-wallet', 'M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M11 18h2', false),
        method('Card', 'M3 6h18v12H3z M3 10h18 M7 15h3', false),
        method('Split payment', 'M16 3h5v5 M8 3H3v5 M21 3l-7 7 M3 3l7 7 M12 12v9', false)
      ],
      quick: [chip('Exact ₱1,986.00', false), chip('₱2,000.00', true), chip('₱2,500.00', false), chip('₱3,000.00', false)],
      keys: [
        digit('1'), digit('2'), digit('3'), digit('4'), digit('5'), digit('6'), digit('7'), digit('8'), digit('9'),
        digit('.'), digit('0'),
        { label: '', aria: 'Delete last digit', isText: false, isIcon: true }
      ]
    };
  }
}
</script>
</body>
</html>
