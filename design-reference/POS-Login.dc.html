<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POS sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Figtree','Segoe UI',system-ui,sans-serif;color:#F5F5F6;background:#08080A;font-variant-numeric:tabular-nums}
button,input{font-family:inherit}
a{color:#E2C15F}a:hover{color:#F5E9BE}
.g{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);box-shadow:0 8px 32px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.10);-webkit-backdrop-filter:blur(24px) saturate(140%);backdrop-filter:blur(24px) saturate(140%)}
.gs{background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.18);box-shadow:0 16px 48px rgba(0,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.16);-webkit-backdrop-filter:blur(32px) saturate(150%);backdrop-filter:blur(32px) saturate(150%)}
</style>
</helmet>
<div style="position:relative;overflow:hidden;isolation:isolate;width:1280px;height:800px;display:flex;background:#08080A;">
  <div style="position:absolute;z-index:-1;left:620px;top:80px;width:560px;height:560px;border-radius:50%;background:#D4AF37;opacity:0.34;filter:blur(140px);pointer-events:none;"></div>
  <div style="position:absolute;z-index:-1;left:-160px;top:300px;width:520px;height:520px;border-radius:50%;background:#6B6B75;opacity:0.34;filter:blur(140px);pointer-events:none;"></div>
  <div style="position:absolute;z-index:-1;left:200px;top:-160px;width:420px;height:420px;border-radius:50%;background:#D4AF37;opacity:0.16;filter:blur(140px);pointer-events:none;"></div>

  <div style="width:640px;flex:none;padding:56px 64px;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:12px;">
      <svg viewBox="0 0 32 32" role="img" aria-label="HCS logo" style="width:40px;height:40px;flex:none"><rect width="32" height="32" rx="8" style="fill:#D4AF37"></rect><path d="M10 8v16M22 8v16" style="fill:none;stroke:#0A0A0B;stroke-width:3.5;stroke-linecap:round"></path><path d="M10 16h12" style="fill:none;stroke:#0A0A0B;stroke-width:3.5;stroke-linecap:round"></path></svg>
      <span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:21px;font-weight:700;color:#fff;">Hustler Central POS</span>
    </div>
    <div style="margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column;gap:10px;">
      <span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:84px;line-height:84px;letter-spacing:-0.02em;font-weight:700;color:#fff;">Main Branch</span>
      <span style="font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:36px;line-height:42px;font-weight:600;color:#E2C15F;">Register 1</span>
      <span style="margin-top:14px;font-size:20px;color:#D6D6DA;">Sunday, 20 September 2026</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px;">
      <div class="g" style="border-radius:20px;padding:18px 22px;display:flex;flex-direction:column;gap:4px;">
        <span style="font-size:17px;font-weight:700;color:#fff;">Register 1 is closed.</span>
        <span style="font-size:15px;line-height:22px;color:#D6D6DA;">Sign in, then open it with your starting cash.</span>
      </div>
      <span class="g" style="display:inline-flex;align-items:center;gap:10px;align-self:flex-start;height:40px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600;color:#fff;"><span style="width:10px;height:10px;border-radius:999px;background:#4AC480;"></span>Online, synced</span>
    </div>
  </div>

  <div style="flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;">
    <div class="gs" style="width:440px;border-radius:32px;padding:36px;display:flex;flex-direction:column;gap:22px;">
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;color:#D6D6DA;">
        <svg viewBox="0 0 24 24" style="width:18px;height:18px;flex:none;color:#E2C15F;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><path d="M12 3l8 3v6c0 4.5-3.2 8.2-8 9-4.8-.8-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-5"></path></svg>
        <span>Registered device for Main Branch, Register 1</span>
      </div>
      <h1 style="margin:0;font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:32px;line-height:36px;font-weight:700;color:#fff;">Enter your PIN</h1>
      <div role="img" aria-label="4 of 6 digits entered" style="display:flex;gap:14px;justify-content:center;">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="width:16px;height:16px;border-radius:999px;background:{{d.fill}};border:2px solid {{d.border}};"></span></sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px;">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button aria-label="{{k.aria}}" style="height:64px;border:1px solid rgba(255,255,255,0.20);border-radius:18px;background:rgba(255,255,255,0.08);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;font-size:{{k.size}}px;font-weight:600;">
            <sc-if value="{{k.isIcon}}" hint-placeholder-val="{{false}}"><svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round"><path d="M20 5H9l-6 7 6 7h11a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z M14 9.5l4 4 M18 9.5l-4 4"></path></svg></sc-if>
            <sc-if value="{{k.isText}}" hint-placeholder-val="{{true}}"><span>{{k.label}}</span></sc-if>
          </button>
        </sc-for>
      </div>
      <a href="POS-Sell.dc.html" style="display:flex;align-items:center;justify-content:center;height:64px;border-radius:18px;background:#D4AF37;color:#0A0A0B;font-size:20px;font-weight:700;text-decoration:none;">Sign in</a>
      <span style="font-size:13px;line-height:19px;color:#B4B4BA;text-align:center;">A manager PIN is asked only for sensitive actions, like refunds and voids.</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const digit = (n) => ({ label: n, aria: n, size: 28, isText: true, isIcon: false });
    return {
      dots: [1, 2, 3, 4, 5, 6].map((i) => (i <= 4 ? { fill: '#D4AF37', border: '#D4AF37' } : { fill: 'transparent', border: 'rgba(255,255,255,0.45)' })),
      keys: [
        digit('1'), digit('2'), digit('3'), digit('4'), digit('5'), digit('6'), digit('7'), digit('8'), digit('9'),
        { label: 'Clear', aria: 'Clear PIN', size: 17, isText: true, isIcon: false },
        digit('0'),
        { label: '', aria: 'Delete last digit', size: 17, isText: false, isIcon: true }
      ]
    };
  }
}
</script>
</body>
</html>
